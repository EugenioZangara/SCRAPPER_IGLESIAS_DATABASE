# La base de producción es Supabase (proyecto Parroguia-prod), NO una base de Render.
# DATABASE_URL se gestiona desde el dashboard de Render (sync: false) en los dos
# servicios. No volver a declarar bloques `databases:` ni `fromDatabase:` acá:
# un blueprint apply repuntaría la app a una base equivocada en silencio.

services:
  - type: web
    name: scraper-catolico
    runtime: python
    buildCommand: ./build.sh
    startCommand: "gunicorn core.wsgi:application --timeout 120"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: scrapper-iglesias-database.onrender.com,parroguia.com,www.parroguia.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://scrapper-iglesias-database.onrender.com,https://parroguia.com,https://www.parroguia.com
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_SESSION_USER
        sync: false
      - key: GOOGLE_SHEETS_ID
        value: "13Rdk0iLA9GPAcmBwnFgA9Qykjz_9AcmWaXv6nzzAPfU"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: APIFY_API_TOKEN
        sync: false

  - type: cron
    name: scraper-instagram
    runtime: python
    schedule: "0 6 * * 1,4"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scraper_redes.run --produccion
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INSTAGRAM_SESSION_USER
        sync: false
      - key: INSTAGRAM_SESSION_B64
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: SCRAPER_BACKEND
        sync: false
